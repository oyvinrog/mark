[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-notes"
version = "0.1.0"
description = "Programmable native Markdown editor"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6,<7"]

[project.scripts]
mark-note = "mark:main"

[tool.setuptools]
py-modules = ["mark"]
